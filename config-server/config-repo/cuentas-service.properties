spring.application.name=cuentas-service
server.port=8085

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.sql.init.mode=never
#spring.sql.init.continue-on-error=true

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}

# Permite publicar y consumir eventos mediante tópicos JMS
spring.jms.pub-sub-domain=true