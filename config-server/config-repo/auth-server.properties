# --------------------------------------------------
# Identificación y puerto
# --------------------------------------------------
spring.application.name=auth-server
server.port=9000

# --------------------------------------------------
# Actuator
# --------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --------------------------------------------------
# OAuth2 Client: GitHub
# --------------------------------------------------
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-name=GitHub

# --------------------------------------------------
# Authorization Server propio
# --------------------------------------------------
spring.security.oauth2.authorizationserver.issuer=http://localhost:9000

# --------------------------------------------------
# JWT propio
# --------------------------------------------------
ms.auth.jwt.issuer=http://localhost:9000
ms.auth.jwt.expiration-seconds=3600

# --------------------------------------------------
# Logging
# --------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=DEBUG