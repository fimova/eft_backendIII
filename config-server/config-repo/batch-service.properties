spring.application.name=batch-service

server.port=8084
# =========================================================
# Spring Batch
# =========================================================
# Crea las tablas internas BATCH_* de Spring Batch
spring.batch.jdbc.initialize-schema=always

# Los Jobs se ejecutan manualmente mediante BatchJobController
spring.batch.job.enabled=false

# =========================================================
# Inicialización SQL
# =========================================================
# Las tablas propias de la aplicación ya existen en Oracle
# schema.sql queda como script de referencia/creación inicial,
# pero NO se ejecuta automáticamente en cada arranque
spring.sql.init.mode=never

# =========================================================
# Archivos de entrada
# =========================================================
app.input.cuentas-anuales=classpath:estados_financieros_anuales.csv
app.input.intereses=classpath:intereses_trimestrales.csv
app.input.transacciones=classpath:movimientos_financieros_diarios.csv

# =========================================================
# Estados financieros anuales
# =========================================================
app.movimiento.chunk-size=100
app.movimiento.core-pool-size=25
app.movimiento.max-pool-size=35
app.movimiento.queue-capacity=50

# =========================================================
# Movimientos financieros diarios
# =========================================================
app.transaccion.chunk-size=100
app.transaccion.core-pool-size=25
app.transaccion.max-pool-size=35
app.transaccion.queue-capacity=50

# =========================================================
# Intereses trimestrales
# =========================================================
app.interes.chunk-size=20
app.interes.core-pool-size=4
app.interes.max-pool-size=8
app.interes.queue-capacity=50

# Periodo para cuenta interes
app.intereses.periodo=2026-08

# En este caso no se registra en eureka4
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false