
spring.application.name=bff-atm
server.port=8089

eureka.instance.prefer-ip-address=true

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:9000/.well-known/jwks.json}

# HTTPS
server.ssl.enabled=true
server.ssl.key-store=${HTTPS_KEYSTORE_PATH}
server.ssl.key-store-password=${HTTPS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=https